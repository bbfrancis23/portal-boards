<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">Schedule widget: a week of days with class and appointment blocks</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A77BFF" stop-opacity="0.14" />
      <stop offset="1" stop-color="#22EEFF" stop-opacity="0.10" />
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A77BFF" />
      <stop offset="1" stop-color="#22EEFF" />
    </linearGradient>
    <clipPath id="inside">
      <rect x="56" y="26" width="208" height="128" rx="14" />
    </clipPath>
  </defs>

  <!-- Soft background -->
  <rect width="320" height="180" fill="url(#sky)" />

  <!-- The week, shrunk around the center so it has room above and below like the others -->
  <g transform="translate(160 90) scale(0.8) translate(-160 -90)">

  <!-- Week body -->
  <rect x="56" y="26" width="208" height="128" rx="14" fill="#ffffff" fill-opacity="0.30" />

  <g clip-path="url(#inside)">
    <!-- Day header row -->
    <rect x="56" y="26" width="208" height="22" fill="#A77BFF" fill-opacity="0.22" />
    <!-- Today's column -->
    <rect x="151.2" y="48" width="37.6" height="106" fill="#22EEFF" fill-opacity="0.08" />
  </g>

  <!-- Hour lines and day columns -->
  <g stroke="#A77BFF" stroke-width="1" opacity="0.35">
    <path d="M56 48 H264" />
    <path d="M76 69 H264 M76 90 H264 M76 112 H264 M76 133 H264" stroke-dasharray="2 5" stroke-linecap="round" />
    <path d="M76 26 V154 M113.6 26 V154 M151.2 26 V154 M188.8 26 V154 M226.4 26 V154" />
  </g>

  <!-- Day names and hour labels -->
  <g fill="#A77BFF" fill-opacity="0.55">
    <rect x="85" y="34" width="20" height="6" rx="3" />
    <rect x="122.6" y="34" width="20" height="6" rx="3" />
    <rect x="160.2" y="34" width="20" height="6" rx="3" />
    <rect x="197.8" y="34" width="20" height="6" rx="3" />
    <rect x="235.4" y="34" width="20" height="6" rx="3" />
    <rect x="62" y="66" width="9" height="5" rx="2.5" />
    <rect x="62" y="109" width="9" height="5" rx="2.5" />
  </g>

  <!-- Classes -->
  <g fill="#22EEFF" fill-opacity="0.30" stroke="#22EEFF" stroke-opacity="0.7" stroke-width="1">
    <rect x="79" y="53" width="31.6" height="26" rx="4" />
    <rect x="116.6" y="119" width="31.6" height="22" rx="4" />
    <rect x="154.2" y="52" width="31.6" height="22" rx="4" />
    <rect x="154.2" y="94" width="31.6" height="28" rx="4" />
    <rect x="191.8" y="127" width="31.6" height="20" rx="4" />
    <rect x="229.4" y="57" width="31.6" height="24" rx="4" />
  </g>

  <!-- Appointments -->
  <g fill="#A77BFF" fill-opacity="0.30" stroke="#A77BFF" stroke-opacity="0.7" stroke-width="1">
    <rect x="79" y="111" width="31.6" height="20" rx="4" />
    <rect x="116.6" y="72" width="31.6" height="30" rx="4" />
    <rect x="191.8" y="63" width="31.6" height="34" rx="4" />
    <rect x="229.4" y="100" width="31.6" height="30" rx="4" />
  </g>

  <!-- Titles inside the blocks -->
  <g fill="#ffffff" fill-opacity="0.85">
    <rect x="83" y="58" width="20" height="4" rx="2" />
    <rect x="158.2" y="57" width="18" height="4" rx="2" />
    <rect x="158.2" y="99" width="22" height="4" rx="2" />
    <rect x="120.6" y="77" width="22" height="4" rx="2" />
    <rect x="195.8" y="68" width="18" height="4" rx="2" />
    <rect x="233.4" y="62" width="20" height="4" rx="2" />
    <rect x="233.4" y="105" width="22" height="4" rx="2" />
  </g>

  <!-- Frame -->
  <rect x="56" y="26" width="208" height="128" rx="14" fill="none" stroke="url(#frame)" stroke-width="2.5" />
  </g>

  <!-- A few floating dots -->
  <circle cx="26" cy="54" r="2.5" fill="#B8FF3C" opacity="0.8" />
  <circle cx="44" cy="132" r="2" fill="#A77BFF" opacity="0.6" />
  <circle cx="292" cy="118" r="3" fill="#22EEFF" opacity="0.7" />
  <circle cx="248" cy="14" r="1.5" fill="#FFC24B" opacity="0.8" />
</svg>
