<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title">
  <title id="title">Chart widget: rising bars with a trend line across their tops</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A77BFF" stop-opacity="0.16" />
      <stop offset="1" stop-color="#22EEFF" stop-opacity="0.10" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22EEFF" />
      <stop offset="1" stop-color="#A77BFF" />
    </linearGradient>
    <linearGradient id="trend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC24B" />
      <stop offset="1" stop-color="#FF6F91" />
    </linearGradient>
    <linearGradient id="axis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22EEFF" />
      <stop offset="1" stop-color="#B8FF3C" />
    </linearGradient>
  </defs>

  <!-- Soft background -->
  <rect width="320" height="180" fill="url(#sky)" />

  <!-- The chart, shrunk around its center to match the table's size -->
  <g transform="translate(160 95) scale(0.9) translate(-160 -95)">

  <!-- Faint grid lines -->
  <g stroke="#A77BFF" stroke-width="1" stroke-dasharray="2 6" stroke-linecap="round" opacity="0.35">
    <path d="M60 60 H260 M60 90 H260 M60 120 H260" />
  </g>

  <!-- Bars, rising left to right -->
  <g fill="#22EEFF" fill-opacity="0.12" stroke="url(#bar)" stroke-width="2.5" stroke-linejoin="round">
    <rect x="72" y="112" width="24" height="38" rx="6" />
    <rect x="110" y="96" width="24" height="54" rx="6" />
    <rect x="148" y="104" width="24" height="46" rx="6" />
    <rect x="186" y="78" width="24" height="72" rx="6" />
    <rect x="224" y="58" width="24" height="92" rx="6" />
  </g>

  <!-- Baseline -->
  <path d="M56 150 H264" stroke="url(#axis)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Trend line with a dot on each bar -->
  <path d="M84 100 L122 84 L160 90 L198 64 L236 44" fill="none" stroke="url(#trend)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <g fill="#ffffff" stroke="url(#trend)" stroke-width="2">
    <circle cx="84" cy="100" r="4" />
    <circle cx="122" cy="84" r="4" />
    <circle cx="160" cy="90" r="4" />
    <circle cx="198" cy="64" r="4" />
    <circle cx="236" cy="44" r="4" />
  </g>
  </g>

  <!-- A few floating dots -->
  <circle cx="34" cy="74" r="2.5" fill="#A77BFF" opacity="0.6" />
  <circle cx="150" cy="22" r="2" fill="#FFC24B" opacity="0.7" />
  <circle cx="278" cy="124" r="3" fill="#B8FF3C" opacity="0.8" />
</svg>
