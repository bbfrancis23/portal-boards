[project]
name = "portal-boards-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.9.1",
    "fastapi[standard]>=0.142.2",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.54",
    "sqlalchemy-libsql>=0.2.0 ; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import sorting
    "UP",  # pyupgrade: modern Python syntax
    "B",   # flake8-bugbear: likely bugs
    "SIM", # flake8-simplify: simpler equivalents
    "C901", # mccabe: functions with too many decision paths (see max-complexity)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
