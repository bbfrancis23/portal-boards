version: 2
updates:
  # JavaScript: root + frontend via the pnpm workspace
  - package-ecosystem: 'npm'
    directories:
      - '/'
    schedule:
      interval: 'weekly'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']

